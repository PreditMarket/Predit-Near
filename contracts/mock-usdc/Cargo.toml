[package]
name = "predit-mock-usdc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Test-only NEP-141 with 6 decimals and an open faucet"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
