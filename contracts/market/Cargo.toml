[package]
name = "predit-market"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Social prediction markets on NEAR: locked rules, bonds, USDC bets, receipts, creator record"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
predit-core = { path = "../core" }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
